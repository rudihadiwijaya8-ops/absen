<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Absensi — Panel 5 Kamera</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#172033}
.wrap{max-width:1500px;margin:auto;padding:16px}
.top{background:#fff;border-radius:14px;padding:15px;box-shadow:0 3px 15px rgba(16,24,40,.08);margin-bottom:14px}
h1{margin:0 0 5px;font-size:25px}.sub{color:#667085;font-size:14px}
.actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
button{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}
.start{background:#16a34a;color:#fff}.stop{background:#dc2626;color:#fff}.detect{background:#1464d2;color:#fff}
.mode{display:inline-block;margin-left:8px;padding:6px 9px;border-radius:7px;background:#eef2f7;font-weight:700}
.statusbar{margin-top:10px;padding:9px 11px;background:#f8fafc;border-radius:9px;font-size:13px}
.diag{margin-top:10px;background:#111827;color:#d1fae5;border-radius:9px;padding:10px;font:12px/1.45 Consolas,monospace;white-space:pre-wrap;max-height:150px;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px}
.card{background:#fff;border:1px solid #d9dee8;border-radius:13px;padding:9px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:8px}
.title{font-weight:800}.badge{font-size:11px;font-weight:700;padding:5px 6px;border-radius:6px;background:#eef2f7}
.ok{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}
.reader{width:100%;aspect-ratio:4/3;background:#0f172a;border-radius:9px;overflow:hidden}
.reader video{width:100%!important;height:100%!important;object-fit:cover!important}
.info{font-size:11px;color:#667085;margin-top:7px;min-height:30px}
.result{font-size:12px;font-weight:700;margin-top:5px;min-height:31px;word-break:break-word}
.debug{font:10px/1.3 Consolas,monospace;color:#475569;background:#f8fafc;border-radius:7px;padding:6px;white-space:pre-wrap;word-break:break-word;margin-top:5px}
@media(max-width:1150px){.grid{grid-template-columns:repeat(3,minmax(210px,1fr))}}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(160px,1fr))}}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>📷 Panel Scanner Absensi — 5 Kamera</h1>
    <div class="sub">Panel ini dibuka sebagai <b>jendela/tab utama</b>, bukan iframe. Dengan demikian kamera GitHub tidak berada di dalam iframe Apps Script.</div>
    <div class="actions">
      <button class="start" id="startBtn">▶ Aktifkan 5 Kamera</button>
      <button class="detect" id="detectBtn">🔄 Deteksi Kamera</button>
      <button class="stop" id="stopBtn">⏹ Matikan Semua</button>
      <span class="mode">Mode: <span id="mode">MASUK</span></span>
    </div>
    <div class="statusbar" id="statusbar">Menunggu perintah dari aplikasi Apps Script.</div>
    <div class="diag" id="diag">Siap.</div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<script>
const params = new URLSearchParams(location.search);
let mode = String(params.get('tipe') || 'MASUK').toUpperCase();
if(mode !== 'PULANG') mode='MASUK';

const slots = Array.from({length:5},(_,i)=>({i,deviceId:'',scanner:null,running:false}));
const grid=document.getElementById('grid');
const diag=document.getElementById('diag');
const statusbar=document.getElementById('statusbar');
document.getElementById('mode').textContent=mode;

function log(t){diag.textContent+=(diag.textContent?'\n':'')+t}
function setStatus(i,t,kind=''){const e=document.getElementById('badge'+i);e.textContent=t;e.className='badge '+kind}
function setDebug(i,t){document.getElementById('debug'+i).textContent=t}
function post(type, i, extra={}){
  try{
    if(window.opener && !window.opener.closed){
      window.opener.postMessage({type,cam:i,tipe:mode,...extra},'*');
    }
  }catch(e){}
}
function postControllerStatus(message){
  try{
    if(window.opener && !window.opener.closed)
      window.opener.postMessage({type:'SCANNER_CONTROLLER_STATUS',tipe:mode,message},'*');
  }catch(e){}
}

for(let i=0;i<5;i++){
  const c=document.createElement('div');
  c.className='card';
  c.innerHTML=`
    <div class="head">
      <div class="title">📷 Kamera ${i+1}</div>
      <div class="badge" id="badge${i}">Menunggu</div>
    </div>
    <div class="reader" id="reader${i}"></div>
    <div class="info" id="info${i}">Menunggu kamera.</div>
    <div class="result" id="result${i}">QR: —</div>
    <div class="debug" id="debug${i}"></div>`;
  grid.appendChild(c);
}

async function getPermissionState(){
  try{
    if(navigator.permissions){
      const p=await navigator.permissions.query({name:'camera'});
      return p.state;
    }
  }catch(e){}
  return 'tidak tersedia';
}
async function enumerateCameras(){
  if(!navigator.mediaDevices?.enumerateDevices)
    throw new Error('MediaDevices.enumerateDevices tidak tersedia');
  return (await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
}
async function detectCameras(){
  diag.textContent='';
  log('=== DETEKSI KAMERA ===');
  log('Origin: '+location.origin);
  log('Secure context: '+location.isSecureContext);
  log('Top-level: '+(window.top===window));
  log('Permission camera: '+await getPermissionState());

  let ds=await enumerateCameras();
  log('Sebelum izin: '+ds.length+' videoinput');

  try{
    const tmp=await navigator.mediaDevices.getUserMedia({video:true,audio:false});
    tmp.getTracks().forEach(t=>t.stop());
    await new Promise(r=>setTimeout(r,250));
  }catch(e){
    log('getUserMedia izin: '+e.name+' — '+(e.message||''));
  }

  ds=await enumerateCameras();
  log('Sesudah izin: '+ds.length+' videoinput');
  ds.forEach((d,n)=>log((n+1)+'. '+(d.label||'Kamera '+(n+1))));

  for(let i=0;i<5;i++){
    if(ds[i]){
      slots[i].deviceId=ds[i].deviceId;
      document.getElementById('info'+i).textContent=ds[i].label||('Kamera '+(i+1));
    }else{
      slots[i].deviceId='';
      document.getElementById('info'+i).textContent='Tidak ada perangkat kamera ke-'+(i+1)+'.';
    }
  }

  log(ds.length>=5?'🟢 5 kamera atau lebih terdeteksi.':'🟡 Terdeteksi '+ds.length+' kamera.');
  postControllerStatus('Deteksi selesai: '+ds.length+' kamera.');
  return ds;
}

async function startOne(i, deviceId){
  const s=slots[i];
  if(!deviceId){setStatus(i,'TIDAK ADA','bad');return false}

  if(s.scanner){
    try{await s.scanner.stop()}catch(e){}
    try{s.scanner.clear()}catch(e){}
    s.scanner=null;
  }
  document.getElementById('reader'+i).innerHTML='';
  document.getElementById('result'+i).textContent='QR: —';
  setStatus(i,'MEMBUKA...');

  try{
    const q=new Html5Qrcode('reader'+i);
    s.scanner=q;

    await q.start(
      {deviceId:{exact:deviceId}},
      {
        fps:10,
        qrbox:function(w,h){
          const z=Math.min(w,h);
          const q=Math.floor(z*0.62);
          return {width:q,height:q};
        }
      },
      text=>{
        document.getElementById('result'+i).textContent='QR: '+text;
        post('ABSENSI_QR',i,{id:String(text).trim(),text:String(text).trim()});
      },
      ()=>{}
    );

    s.running=true;
    setStatus(i,'AKTIF','ok');
    document.getElementById('info'+i).textContent='Kamera aktif.';
    setDebug(i,'Html5Qrcode: OK\ndeviceId: '+deviceId.slice(0,35));
    post('SCANNER_STATUS',i,{status:'AKTIF',message:'Kamera '+(i+1)+' aktif.'});
    return true;
  }catch(e){
    s.running=false;
    setStatus(i,e.name||'GAGAL','bad');
    document.getElementById('info'+i).textContent='Gagal membuka kamera.';
    setDebug(i,'ERROR: '+(e.name||'Unknown')+'\n'+(e.message||e));
    post('SCANNER_STATUS',i,{status:'GAGAL',message:'Kamera '+(i+1)+' gagal: '+(e.name||'Unknown'),errorName:e.name||'',errorMessage:e.message||''});
    return false;
  }
}

async function startAll(){
  statusbar.textContent='Meminta izin dan mendeteksi kamera...';
  const ds=await detectCameras();
  if(!ds.length){
    statusbar.textContent='❌ Tidak ada kamera yang terdeteksi.';
    return;
  }

  await stopAll(false);
  let active=0;
  for(let i=0;i<5;i++){
    if(slots[i].deviceId){
      const ok=await startOne(i,slots[i].deviceId);
      if(ok) active++;
      await new Promise(r=>setTimeout(r,250));
    }
  }
  statusbar.textContent='📷 '+active+' / 5 kamera aktif. Mode '+mode+'.';
  postControllerStatus(active+' / 5 kamera aktif.');
}

async function stopAll(notify=true){
  for(const s of slots){
    if(s.scanner){
      try{await s.scanner.stop()}catch(e){}
      try{s.scanner.clear()}catch(e){}
      s.scanner=null;
    }
    s.running=false;
  }
  for(let i=0;i<5;i++)setStatus(i,'BERHENTI');
  if(notify){
    statusbar.textContent='⏹ Semua kamera dimatikan.';
    postControllerStatus('Semua kamera dimatikan.');
  }
}

document.getElementById('startBtn').onclick=startAll;
document.getElementById('detectBtn').onclick=detectCameras;
document.getElementById('stopBtn').onclick=()=>stopAll(true);

window.addEventListener('beforeunload',()=>{
  try{
    if(window.opener && !window.opener.closed)
      window.opener.postMessage({type:'SCANNER_CONTROLLER_CLOSED'},'*');
  }catch(e){}
});

window.addEventListener('message',event=>{
  if(!event.data)return;
  if(event.data.type==='SET_ABSENSI_TIPE'){
    mode=String(event.data.tipe||'MASUK').toUpperCase()==='PULANG'?'PULANG':'MASUK';
    document.getElementById('mode').textContent=mode;
    statusbar.textContent='Mode diubah menjadi '+mode+'.';
  }
});

window.addEventListener('load',()=>{
  postControllerStatus('Panel kamera siap. Klik Aktifkan 5 Kamera.');
  // Tidak meminta kamera otomatis; permintaan dilakukan melalui tombol pengguna.
});
</script>
</body>
</html>

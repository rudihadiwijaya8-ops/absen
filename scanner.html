<!DOCTYPE html>
Scanner QR Absensi
<h1>📷 Scanner QR Absensi</h1>

<div class="muted">
  Arahkan kamera ke QR siswa.
  Setelah berhasil, kamera tetap aktif untuk scan berikutnya.
</div>

<div id="tipeAbsensi" class="tipe">
  ABSEN MASUK
</div>

<div id="reader"></div>

<div id="cameraStatus" class="status-camera">
  🟡 Memulai kamera...
</div>

<div id="hasil">
  Meminta akses kamera...
</div>

<div class="buttons">
  <button class="btn-start" onclick="mulaiKamera()">
    📷 Mulai Kamera
  </button>

  <button class="btn-stop" onclick="stopKamera()">
    ⏹ Stop Kamera
  </button>
</div>

<button class="btn-back" onclick="kembali()">
  ↩ Kembali
</button>

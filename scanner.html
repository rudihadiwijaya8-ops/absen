<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Scanner QR Absensi</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body{margin:0;background:#0f172a;color:#fff;font-family:Arial,sans-serif}
    .wrap{max-width:520px;margin:auto;padding:18px}
    .box{background:#fff;color:#172033;border-radius:18px;padding:18px}
    h1{font-size:22px;margin:0 0 6px}
    .muted{color:#667085;font-size:13px}
    #reader{width:100%;margin-top:18px}
    #hasil{margin-top:15px;padding:14px;border-radius:12px;background:#f2f4f7;word-break:break-word}
    .ok{background:#ecfdf3!important;color:#027a48}
    .err{background:#fef3f2!important;color:#b42318}
    #lampuSukses{
      position:fixed;inset:0;pointer-events:none;display:none;
      background:rgba(34,197,94,.22);z-index:9999;
    }
    #lampuSukses.nyala{display:block;animation:flashSuccess .35s ease-in-out 2}
    @keyframes flashSuccess{
      0%,100%{opacity:0}
      50%{opacity:1}
    }
    button{padding:12px 16px;border:0;border-radius:10px;background:#1464d2;color:#fff;font-weight:700;margin-top:12px}
  </style>
</head>
<body>
<div id="lampuSukses"></div>
<div class="wrap">
  <div class="box">
    <h1>📷 Scanner QR Absensi</h1>
    <div class="muted">Pilih perangkat kamera untuk slot ini, lalu arahkan kamera ke QR siswa.</div>

    <div style="margin-top:14px;text-align:left">
      <label for="cameraDevice" style="display:block;font-weight:700;font-size:13px;margin-bottom:6px">Perangkat kamera</label>
      <select id="cameraDevice" style="width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:10px;background:#fff">
        <option value="">Mendeteksi kamera...</option>
      </select>
    </div>

    <div id="reader"></div>
    <div id="hasil">Meminta akses kamera...</div>

    <button onclick="location.reload()">🔄 Ulangi Scanner</button>
    <button onclick="kembali()">↩ Kembali</button>
  </div>
</div>

<script>
let scanner = null;
let sudahScan = false;
let currentStream = null;

const params = new URLSearchParams(location.search);
const tipe = String(params.get("tipe") || "MASUK").toUpperCase();
const camIndex = Math.max(0, Number(params.get("cam") || 0));
const multi = params.get("multi") === "1";

function hasil(text, cls) {
  const el = document.getElementById("hasil");
  el.className = cls || "";
  el.innerHTML = text;
}

function statusKeInduk(message) {
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({
        type: "SCANNER_STATUS",
        cam: camIndex,
        message: message
      }, "*");
    }
    if (window.opener) {
      window.opener.postMessage({
        type: "SCANNER_STATUS",
        cam: camIndex,
        message: message
      }, "*");
    }
  } catch(e) {}
}

function parseQr(raw) {
  raw = String(raw || "").trim();

  try {
    const u = new URL(raw);
    const id = (u.searchParams.get("id") || "").trim();
    const nama = (
      u.searchParams.get("nama") ||
      u.searchParams.get("name") ||
      ""
    ).trim();

    if (id) return { id, nama };
  } catch (e) {}

  return { id: raw, nama: "" };
}

function tandaBerhasil(nama) {
  const lampu = document.getElementById("lampuSukses");
  lampu.classList.remove("nyala");
  void lampu.offsetWidth;
  lampu.classList.add("nyala");

  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) {
      const ctx = new AudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = "sine";
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      osc.frequency.setValueAtTime(1320, ctx.currentTime + 0.10);

      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.20);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.21);
      osc.addEventListener("ended", () => { try { ctx.close(); } catch(e) {} });
    }
  } catch(e) {}

  if (nama && "speechSynthesis" in window) {
    try {
      window.speechSynthesis.cancel();
      const ucapan = new SpeechSynthesisUtterance(
        "Absensi berhasil, " + nama
      );
      ucapan.lang = "id-ID";
      ucapan.rate = 0.95;
      ucapan.pitch = 1;
      ucapan.volume = 1;
      window.speechSynthesis.speak(ucapan);
    } catch(e) {}
  }
}

function kirimKeInduk(id, nama) {
  const payload = {
    type: "ABSENSI_QR",
    id: id,
    nama: nama,
    tipe: tipe,
    cam: camIndex
  };

  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage(payload, "*");
    } else if (window.opener) {
      window.opener.postMessage(payload, "*");
    } else {
      hasil(
        "❌ Scanner tidak terhubung ke aplikasi utama.",
        "err"
      );
      return;
    }
  } catch(e) {
    hasil("❌ Gagal mengirim hasil scan ke aplikasi utama.", "err");
    return;
  }

  tandaBerhasil(nama);

  hasil(
    "✅ QR TERBACA<br><br>" +
    "<b>Nama:</b> " + escapeHtml(nama || "Nama dari server") + "<br>" +
    "<b>ID:</b> " + escapeHtml(id) + "<br>" +
    "<b>Tipe:</b> " + escapeHtml(tipe) +
    "<br><br>📷 Kamera tetap aktif.",
    "ok"
  );

  // Jangan window.close() pada mode multi-kamera/iframe.
  if (!multi) {
    setTimeout(() => {
      try { window.close(); } catch(e) {}
    }, 700);
  }
}

function escapeHtml(v) {
  return String(v || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

async function daftarKamera() {
  const select = document.getElementById("cameraDevice");
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error("Browser tidak menyediakan akses kamera.");
  }

  // Minta izin pada origin scanner ini agar deviceId dan label kamera tersedia.
  const izin = await navigator.mediaDevices.getUserMedia({
    video: true,
    audio: false
  });
  izin.getTracks().forEach(t => t.stop());

  const devices = (await navigator.mediaDevices.enumerateDevices())
    .filter(d => d.kind === "videoinput");

  if (!devices.length) throw new Error("Tidak ada kamera yang terdeteksi.");

  select.innerHTML = '<option value="">-- Pilih perangkat kamera --</option>';
  devices.forEach((device, index) => {
    const option = document.createElement("option");
    option.value = device.deviceId;
    option.textContent = device.label || ("Kamera terdeteksi " + (index + 1));
    select.appendChild(option);
  });

  // Default slot menggunakan kamera sesuai nomor slot jika tersedia.
  const preferred = devices[Math.min(camIndex, devices.length - 1)];
  if (preferred) select.value = preferred.deviceId;

  return devices;
}

async function mulaiKamera() {
  if (!window.isSecureContext) {
    hasil("❌ Scanner harus dibuka melalui HTTPS.", "err");
    return;
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    hasil("❌ Browser tidak menyediakan akses kamera.", "err");
    return;
  }

  try {
    const devices = await daftarKamera();
    const select = document.getElementById("cameraDevice");
    const deviceId = select.value;
    if (!deviceId) throw new Error("Pilih perangkat kamera terlebih dahulu.");

    select.disabled = true;

    scanner = new Html5Qrcode("reader");

    const config = {
      fps: 10,
      qrbox: function(viewfinderWidth, viewfinderHeight) {
        const size = Math.min(
          Math.floor(viewfinderWidth * 0.75),
          Math.floor(viewfinderHeight * 0.75),
          300
        );
        return { width: size, height: size };
      },
      aspectRatio: 1.0
    };

    await scanner.start(
      { deviceId: { exact: deviceId } },
      config,
      decodedText => {
        if (sudahScan) return;
        sudahScan = true;

        const dataQr = parseQr(decodedText);
        const id = dataQr.id;
        const nama = dataQr.nama;

        if (!id) {
          sudahScan = false;
          hasil("❌ QR kosong/tidak valid.", "err");
          return;
        }

        kirimKeInduk(id, nama);

        setTimeout(() => {
          sudahScan = false;
          hasil("📷 Kamera tetap aktif.<br><br>Silakan arahkan ke QR siswa berikutnya.");
        }, 1200);
      },
      () => {}
    );

    hasil("📷 Kamera " + (camIndex + 1) + " aktif.<br><br>Arahkan kamera ke QR siswa.");
    statusKeInduk("🟢 Kamera " + (camIndex + 1) + " aktif.");
  } catch (err) {
    const select = document.getElementById("cameraDevice");
    if (select) select.disabled = false;
    hasil(
      "❌ KAMERA GAGAL<br><br>" +
      "Pastikan kamera berbeda tersedia dan izin kamera diberikan.<br><br>" +
      "<small>" + escapeHtml(err && err.message ? err.message : err) + "</small>",
      "err"
    );
    statusKeInduk("🔴 Kamera " + (camIndex + 1) + " gagal: " +
      (err && err.message ? err.message : err));
  }
}

function kembali() {
  try {
    if (window.parent && window.parent !== window) return;
    if (window.opener) {
      window.close();
      return;
    }
  } catch(e) {}
  history.back();
}

window.addEventListener("load", mulaiKamera);
</script>
</body>
</html>

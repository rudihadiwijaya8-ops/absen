<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Scanner QR Absensi</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body{margin:0;background:#0f172a;color:#fff;font-family:Arial,sans-serif}
    .wrap{max-width:520px;margin:auto;padding:18px}
    .box{background:#fff;color:#172033;border-radius:18px;padding:18px}
    h1{font-size:22px;margin:0 0 6px}
    .muted{color:#667085;font-size:13px}
    #reader{width:100%;margin-top:18px}
    #hasil{margin-top:15px;padding:14px;border-radius:12px;background:#f2f4f7;word-break:break-word}
    .ok{background:#ecfdf3!important;color:#027a48}
    .err{background:#fef3f2!important;color:#b42318}
    #lampuSukses{
      position:fixed;inset:0;pointer-events:none;display:none;
      background:rgba(34,197,94,.22);z-index:9999;
    }
    #lampuSukses.nyala{display:block;animation:flashSuccess .35s ease-in-out 2}
    @keyframes flashSuccess{
      0%,100%{opacity:0}
      50%{opacity:1}
    }
    button{padding:12px 16px;border:0;border-radius:10px;background:#1464d2;color:#fff;font-weight:700;margin-top:12px}
  </style>
</head>
<body>
<div id="lampuSukses"></div>
<div class="wrap">
  <div class="box">
    <h1>📷 Scanner QR Absensi</h1>
    <div class="muted">Arahkan kamera ke QR siswa.</div>

    <div id="reader"></div>
    <div id="hasil">Meminta akses kamera...</div>

    <button onclick="location.reload()">🔄 Ulangi Scanner</button>
    <button onclick="kembali()">↩ Kembali</button>
  </div>
</div>

<script>
let scanner = null;
let sudahScan = false;

const params = new URLSearchParams(location.search);
const tipe = String(params.get("tipe") || "MASUK").toUpperCase();

function hasil(text, cls) {
  const el = document.getElementById("hasil");
  el.className = cls || "";
  el.innerHTML = text;
}

function normalizeQr(raw) {
  raw = String(raw || "").trim();

  // QR utama: cukup berisi ID siswa, misalnya S00000001.
  // Tetap dukung QR lama berbentuk URL?id=S00000001.
  try {
    const u = new URL(raw);
    const id = u.searchParams.get("id");
    if (id) return id.trim();
  } catch (e) {}

  return raw;
}


function tandaBerhasil() {
  // Lampu layar berkedip
  const lampu = document.getElementById("lampuSukses");
  lampu.classList.remove("nyala");
  void lampu.offsetWidth;
  lampu.classList.add("nyala");

  // Suara "beep" menggunakan Web Audio API, tanpa file audio tambahan
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) {
      const ctx = new AudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = "sine";
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      osc.frequency.setValueAtTime(1320, ctx.currentTime + 0.10);

      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.20);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.21);

      osc.addEventListener("ended", () => {
        try { ctx.close(); } catch(e) {}
      });
    }
  } catch(e) {}
}

function kirimKeInduk(id) {
  if (!window.opener || window.opener.closed) {
    hasil(
      "❌ Scanner tidak menemukan jendela aplikasi utama.<br><br>" +
      "Buka scanner dari tombol <b>ABSEN MASUK</b> atau <b>ABSEN PULANG</b> di aplikasi.",
      "err"
    );
    sudahScan = false;
    return;
  }

  // Kirim ID saja. Nama siswa diambil oleh aplikasi/server utama
  // berdasarkan ID yang ada di data siswa.
  window.opener.postMessage({
    type: "ABSENSI_QR",
    id: id,
    tipe: tipe
  }, "*");

  hasil(
    "✅ QR BERHASIL DIBACA<br><br>" +
    "<b>ID:</b> " + escapeHtml(id) + "<br>" +
    "<b>Tipe:</b> " + escapeHtml(tipe) +
    "<br><br>Memproses di aplikasi utama...",
    "ok"
  );

  // Beri waktu agar postMessage diterima sebelum jendela scanner ditutup.
  setTimeout(() => {
    try { window.close(); } catch(e) {}
  }, 900);
}

function escapeHtml(v) {
  return String(v || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function mulaiKamera() {
  if (!window.isSecureContext) {
    hasil(
      "❌ HALAMAN TIDAK HTTPS<br><br>" +
      "Scanner harus dibuka melalui HTTPS. GitHub Pages menyediakan HTTPS.",
      "err"
    );
    return;
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    hasil(
      "❌ Browser tidak menyediakan akses kamera.",
      "err"
    );
    return;
  }

  scanner = new Html5Qrcode("reader");

  const config = {
    fps: 10,
    qrbox: function(viewfinderWidth, viewfinderHeight) {
      const size = Math.min(
        Math.floor(viewfinderWidth * 0.75),
        Math.floor(viewfinderHeight * 0.75),
        300
      );
      return { width: size, height: size };
    }
  };

  scanner.start(
    { facingMode: "environment" },
    config,
    decodedText => {
      if (sudahScan) return;
      sudahScan = true;

      const id = normalizeQr(decodedText);

      if (!id) {
        sudahScan = false;
        hasil("❌ QR kosong/tidak valid.", "err");
        return;
      }

      kirimKeInduk(id);
    },
    () => {
      // Error scan per frame sengaja diabaikan.
    }
  ).then(() => {
    hasil(
      "📷 Kamera aktif.<br><br>Arahkan kotak kamera ke QR siswa."
    );
  }).catch(err => {
    hasil(
      "❌ KAMERA GAGAL<br><br>" +
      "1. Izinkan kamera pada browser.<br>" +
      "2. Pastikan scanner dibuka melalui HTTPS.<br>" +
      "3. Pastikan kamera tidak sedang digunakan aplikasi lain.<br><br>" +
      "<small>" + escapeHtml(err) + "</small>",
      "err"
    );
  });
}

function kembali() {
  try {
    if (window.opener) {
      window.close();
      return;
    }
  } catch(e) {}
  history.back();
}

window.addEventListener("load", mulaiKamera);
</script>
</body>
</html>
